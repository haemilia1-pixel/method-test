<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INVITRO | Просмотр данных</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,900;1,900&display=swap');

        :root {
            /* Фирменный точный цвет INVITRO */
            --invitro-cyan: #00a0c6; 
            --invitro-cyan-hover: #008eb8;
            --invitro-dark: #0F2B36;
            --text-main: #333333;
            --text-muted: #5c6b70;
            --bg-page: #f4f7f6;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --highlight-red: #e53935;
            --value-bg: #f7fafb;
        }

        body {
            font-family: 'Montserrat', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- Фирменный Header --- */
        .header {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            margin-bottom: 20px;
            border-top: 4px solid var(--invitro-cyan);
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        .brand-bar {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        .logo-word {
            font-size: 26px;
            font-weight: 900;
            font-style: italic;
            color: var(--invitro-cyan);
            letter-spacing: -0.02em;
            line-height: 1;
        }
        .logo-sub {
            font-size: 13px;
            font-weight: 700;
            color: var(--invitro-cyan);
            margin-left: 15px;
            padding-left: 15px;
            border-left: 2px solid var(--invitro-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
        }
        .header-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-export {
            background-color: transparent;
            color: var(--invitro-cyan);
            border: 2px solid var(--invitro-cyan);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-export:hover {
            background-color: var(--invitro-cyan);
            color: white;
        }

        .btn-clear {
            background-color: transparent;
            color: #666;
            border: 1px solid #ccc;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-clear:hover {
            background-color: #eee;
            color: #111;
        }

        /* Кнопки переключения режимов */
        .btn-toggle-action {
            background-color: transparent;
            color: #666;
            border: 1px solid #ccc;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-toggle-action:hover {
            background-color: #eee;
        }
        .btn-toggle-action.active {
            background-color: var(--invitro-cyan);
            color: white;
            border-color: var(--invitro-cyan);
        }

        .header h2 {
            margin: 0 0 15px 0;
            color: var(--invitro-dark);
            font-size: 20px;
            font-weight: 700;
        }

        .file-upload-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 5px;
        }
        .btn-upload {
            background-color: var(--invitro-cyan);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: inline-block;
        }
        .btn-upload:hover {
            background-color: var(--invitro-cyan-hover);
        }
        input[type="file"] {
            display: none;
        }
        .file-name {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .status { font-size: 13px; color: var(--invitro-cyan); font-weight: 600; margin-bottom: 10px; }

        details.loaded-files-details {
            background: #fafcfc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 15px;
            font-size: 13px;
            margin-top: 10px;
        }
        details.loaded-files-details summary {
            font-weight: 700;
            color: var(--invitro-cyan);
            cursor: pointer;
            outline: none;
            user-select: none;
        }
        details.loaded-files-details ul {
            margin: 10px 0 0 0;
            padding-left: 20px;
            color: var(--invitro-dark);
            line-height: 1.5;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed var(--border-color);
            align-items: flex-end;
        }
        .filter-group {
            position: relative;
            display: flex;
            flex-direction: column;
            min-width: 240px;
            flex: 1;
        }
        .filter-group-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }
        .filter-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--invitro-dark);
            margin-bottom: 0;
            text-transform: none;
            letter-spacing: 0.02em;
            line-height: 1.3;
            flex: 1;
        }
        .filter-selection-clear {
            display: none;
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            padding: 0;
            border: none;
            border-radius: 4px;
            background: #e8eef0;
            color: var(--invitro-dark);
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
            font-family: inherit;
            align-items: center;
            justify-content: center;
        }
        .filter-selection-clear:hover {
            background: #dde5e8;
            color: var(--highlight-red);
        }

        .filter-search-wrap {
            position: relative;
            width: 100%;
        }
        .filter-search-wrap .filter-search-input {
            width: 100%;
            box-sizing: border-box;
        }
        .filter-search-wrap .filter-search-input.has-selection-count {
            padding-right: 46px;
        }
        .filter-selection-count {
            display: none;
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            font-size: 10px;
            font-weight: 800;
            line-height: 1.2;
            background: var(--invitro-cyan);
            color: #fff;
            border-radius: 999px;
            padding: 3px 8px;
            min-width: 22px;
            text-align: center;
            z-index: 1;
        }
        .filter-selection-count.visible {
            display: block;
        }
        
        .dropdown-check-list {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            padding: 5px 0;
        }
        .dropdown-check-list.show {
            display: block;
        }
        .dropdown-hint {
            padding: 10px 12px;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.45;
            border-bottom: 1px dashed var(--border-color);
        }
        .dropdown-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.1s ease;
        }
        .dropdown-item:hover {
            background-color: #f0f7f7;
        }
        .dropdown-item input[type="checkbox"] {
            margin-right: 10px;
            width: 16px;
            height: 16px;
            accent-color: var(--invitro-cyan);
            cursor: pointer;
        }
        .dropdown-item label {
            margin: 0;
            padding: 0;
            text-transform: none;
            font-weight: 500;
            color: var(--invitro-dark);
            cursor: pointer;
            width: 100%;
            display: block;
        }

        .filter-summary-bar {
            display: none;
            width: 100%;
            margin-top: 14px;
            padding: 10px 14px;
            background: linear-gradient(90deg, #f0f9fb 0%, #fafcfc 100%);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 12px;
            color: var(--invitro-dark);
            line-height: 1.5;
        }
        .filter-summary-bar.visible {
            display: block;
        }
        .filter-summary-bar strong {
            color: var(--invitro-cyan);
            font-weight: 700;
        }
        .filter-summary-group {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin-right: 4px;
        }
        .filter-summary-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px 3px 10px;
            background: #fff;
            border: 1px solid #c5e3ed;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            color: var(--invitro-dark);
            max-width: 100%;
            word-break: break-word;
            cursor: pointer;
            font-family: inherit;
            transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
        }
        .filter-summary-chip:hover {
            border-color: var(--invitro-cyan);
            background: #f0f9fb;
            color: var(--invitro-dark);
        }
        .filter-summary-chip-x {
            color: var(--invitro-cyan);
            font-size: 14px;
            line-height: 1;
            font-weight: 700;
        }
        .filter-summary-chip:hover .filter-summary-chip-x {
            color: var(--highlight-red);
        }
        .filter-actions {
            display: none;
            width: 100%;
            margin-top: 12px;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-actions.visible {
            display: flex;
        }
        .btn-apply-filters {
            background-color: var(--invitro-cyan);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 22px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-apply-filters:hover {
            background-color: var(--invitro-cyan-hover);
        }
        .btn-apply-filters.pending {
            box-shadow: 0 0 0 3px rgba(0, 160, 198, 0.35);
        }

        .results-toolbar {
            display: none;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            padding: 12px 16px;
            background: var(--bg-card);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .results-toolbar.visible {
            display: flex;
        }
        .results-toolbar label {
            font-size: 11px;
            font-weight: 700;
            color: var(--invitro-dark);
            white-space: nowrap;
        }
        .results-search-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 220px;
        }
        .results-search-input {
            flex: 1;
            min-width: 140px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
        }
        .results-search-input:focus {
            outline: 2px solid rgba(0, 160, 198, 0.35);
            border-color: var(--invitro-cyan);
        }
        .results-search-nav {
            display: none;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .results-search-nav.visible {
            display: flex;
        }
        #resultsSearchMatchCounter {
            font-size: 12px;
            font-weight: 700;
            color: var(--invitro-dark);
            white-space: nowrap;
            min-width: 6.5em;
            text-align: center;
        }
        .results-search-step-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--invitro-cyan);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            line-height: 1;
        }
        .results-search-step-btn:hover:not(:disabled) {
            border-color: var(--invitro-cyan);
            background: rgba(0, 160, 198, 0.08);
        }
        .results-search-step-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .results-count-pill {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            scroll-margin-top: 16px;
            background: var(--bg-card);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(15, 43, 54, 0.06);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-left: 5px solid var(--invitro-cyan);
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            row-gap: 12px;
            column-gap: 30px; 
        }
        .card.filtered-out {
            display: none !important;
        }
        
        @media (max-width: 800px) {
            .card { grid-template-columns: 1fr; } 
        }

        .card-field.full-width-header {
            grid-column: 1 / -1; 
            margin-bottom: 14px;
            padding-bottom: 14px;
            border-bottom: 2px solid var(--border-color);
        }
        .card-field.full-width-header .card-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--invitro-cyan);
        }

        .card-field {
            padding-bottom: 10px;
            border-bottom: 1px dashed #f0f0f0;
        }
        .card-label {
            font-size: 11px;
            text-transform: none;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.02em;
        }
        .card-value {
            font-size: 14px;
            line-height: 1.62;
            color: var(--invitro-dark);
            font-weight: 500;
            white-space: pre-line;
            max-width: 42em;
        }
        .card-value.card-value--block {
            max-width: none;
        }
        .card-value.card-value--multiline {
            padding: 10px 12px;
            background: var(--value-bg);
            border-radius: 8px;
            border: 1px solid #e8eef0;
        }
        .card-value-expand-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
            align-items: center;
        }
        .card-value-expand {
            display: inline-block;
            padding: 0;
            border: none;
            background: none;
            color: var(--invitro-cyan);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .card-value-expand:hover {
            color: var(--invitro-cyan-hover);
        }
        .card-field--profile-codes {
            grid-column: 1 / -1;
        }
        .profile-codes-wrap {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .profile-codes-summary {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .profile-codes-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .profile-chip {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.3;
            padding: 4px 10px;
            border-radius: 999px;
            background: #e8f4f8;
            border: 1px solid #c5e3ed;
            color: var(--invitro-dark);
            max-width: 100%;
            word-break: break-word;
        }
        .profile-chip--dim {
            opacity: 0.45;
        }
        .profile-chip mark.search-highlight {
            background: #fff9c4;
            border-radius: 2px;
            padding: 0 1px;
        }
        .profile-codes-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .profile-codes-search-input {
            flex: 1;
            min-width: 140px;
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 12px;
        }
        .profile-codes-search-input:focus {
            outline: 2px solid rgba(0, 160, 198, 0.35);
            border-color: var(--invitro-cyan);
        }
        .profile-codes-meta {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .profile-codes-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .profile-codes-btn {
            border: none;
            background: none;
            color: var(--invitro-cyan);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            text-decoration: underline;
            text-underline-offset: 2px;
            padding: 2px 4px;
        }
        .profile-codes-btn:hover {
            color: var(--invitro-cyan-hover);
        }
        mark.search-highlight {
            background: #fff9c4;
            color: inherit;
            padding: 0 1px;
            border-radius: 2px;
        }
        mark.search-highlight--current {
            background: #ffe082;
            box-shadow: 0 0 0 2px var(--invitro-cyan);
            border-radius: 2px;
        }
        
        .no-data {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            background: var(--bg-card);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }
        .meta-info {
            text-align: right;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 10px;
            font-weight: 500;
        }

        .sheet-picker {
            display: none;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            font-size: 13px;
            color: var(--invitro-dark);
        }
        .sheet-picker.visible { display: flex; flex-wrap: wrap; }
        .sheet-picker label { font-weight: 700; }
        .sheet-picker select {
            min-width: 220px;
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
        }

        .column-warning {
            display: none;
            margin-top: 10px;
            padding: 10px 14px;
            background: #fff8e6;
            border: 1px solid #ffd54f;
            border-radius: 8px;
            font-size: 12px;
            color: #5d4037;
            line-height: 1.45;
        }
        .column-warning.visible { display: block; }

        .filter-summary-clear {
            margin-left: 8px;
            padding: 0 6px;
            border: none;
            background: none;
            color: var(--invitro-cyan);
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            vertical-align: middle;
        }
        .filter-summary-clear:hover { color: var(--invitro-cyan-hover); }

        .results-layout {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }
        .toc-sidebar {
            display: none;
            flex: 0 0 220px;
            position: sticky;
            top: 16px;
            max-height: calc(100vh - 32px);
            overflow: auto;
            padding: 12px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .toc-sidebar.visible { display: block; }
        .toc-sidebar h4 {
            margin: 0 0 10px 0;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }
        .toc-sidebar a {
            display: block;
            padding: 6px 0;
            color: var(--invitro-dark);
            text-decoration: none;
            border-bottom: 1px solid #f0f0f0;
            line-height: 1.35;
        }
        .toc-sidebar a:last-child { border-bottom: none; }
        .toc-sidebar a:hover { color: var(--invitro-cyan); }
        .results-main { flex: 1; min-width: 0; }

        .card-header-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            grid-column: 1 / -1;
        }
        .card-actions {
            display: flex;
            flex-shrink: 0;
            gap: 8px;
            align-items: center;
        }
        .card-select-cb {
            width: 16px;
            height: 16px;
            accent-color: var(--invitro-cyan);
            cursor: pointer;
        }
        .btn-card-mini {
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            color: var(--invitro-cyan);
            background: #f0f9fb;
            border: 1px solid #b8dfe8;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }
        .btn-card-mini:hover {
            background: #e0f3f7;
        }

        .lazy-sentinel {
            height: 4px;
            margin: 8px 0;
            grid-column: 1 / -1;
        }

        .compare-panel {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 2000;
            width: min(560px, calc(100vw - 40px));
            max-height: min(70vh, 520px);
            overflow: auto;
            padding: 16px;
            background: var(--bg-card);
            border: 2px solid var(--invitro-cyan);
            border-radius: 12px;

<script>

        displayMicro: [

            "Питательные среды для посева",

            {

                sep: "\n",

                ]
            },
            {

                sep: "\n",

            }
        ],
        
        highlightDifferences: false, 
        groupTests: false, // Вкл: одна карточка на «Код теста Название теста»
        /** Вкл: в карточке только столбцы диапазона Excel U–AL (индексы 20–37 в первой строке листа). */

        /** Как склеивать несколько разных значений по одному полю (несколько строк Excel под одним тестом): запятая или с новой строки. */

        /** По этим столбцам делим карточки; значения в ячейке через «,» / «;» — отдельная карточка на каждый код. */
        cardGroupByColumns: ["Код профиля тестов"],
        /** Поля длиннее этого числа символов сворачиваются с кнопкой «Показать полностью». */

        profileCodesField: "Код профиля тестов",
        /** Свернуть список кодов профиля в карточке, если кодов больше порога. */

        /** Сколько чипов показывать в свёрнутом виде. */

        /** Ленивый список фильтра: если значений больше — в DOM только по поиску. */
        filterDropdownLazyMin: 80,
        filterDropdownMaxItems: 200,
        /** С этого числа строк — режим большой таблицы (группы тестов, без восстановления фильтров). */
        largeFileRowThreshold: 2500,
        /** Индексация фильтров порциями (строк за шаг). */
        largeFileIndexingChunk: 400,
        /** Лимит виртуальных карточек (тест×профиль); выше — блокируем отрисовку. */
        maxVirtualCards: 12000,
        /** Без «Группы тестов» не строить карточки, если отфильтровано больше строк. */
        maxFilteredRowsStrictProfileMode: 3500,
        /** Задержка поиска по карточкам (мс). */
        resultsSearchDebounceMs: 200,
        /** Сохранять выбранные фильтры в localStorage (ключ). */
        filtersStorageKey: "invitro_viewer_filters_v1",
        /** Колонки, без которых выводится предупреждение (имена из CONFIG). */
        requiredColumns: ["Код теста Название теста"],
        /** Показывать оглавление при числе карточек не меньше порога. */
        tocMinCards: 5,
        /** Порция карточек при «ленивой» подгрузке (0 = отключить). */
        lazyRenderBatch: 25,
        headerColumn: "Код теста Название теста"
    };
    // ==========================================

    /** Активная схема карточки: после загрузки файла — OPP-10587 (displayStandard) или OPP-10588 (displayMicro). */
    let activeDisplay = CONFIG.displayStandard.slice();

    let globalData = [];
    /** Кэш сопоставления заголовков столбцов для быстрого getRowValue. */
    let rowColumnCache = null;
    /** Уникальные значения фильтров (строится один раз на загрузку). */
    let filterUniquesIndex = null;
    /** Справочник: значение фильтра → индексы строк в globalData (для быстрого «Применить»). */
    let filterRowIndex = null;
    /** Сбрасывается при новой загрузке листа — отменяет отложенную индексацию. */
    let sheetLoadToken = 0;
    let selectedFilters = {};
    /** Применённые фильтры (поиск и строка «Активные фильтры»). */
    let appliedFilters = {};
    let currentFilteredData = [];
    let currentAnyFilterActive = false;

    let resultsSearchTimer = null;
    let lastResultsSearchQuery = "";
    let resultsSearchMarks = [];
    let resultsSearchActiveIndex = -1;

    let pendingWorkbook = null;
    let lastLoadedFileName = "";
    let lazyRenderState = null;
    let lazyObserver = null;
    let scrollTopTicking = false;

    /** Первая строка листа (заголовки столбцов), по порядку A, B, C… — для среза U–AL. */
    let sheetHeaderRow = null;
    /** Диапазон «только ЛКК»: столбцы U–AL включительно (0-based индексы в первой строке). */
    var LKK_COL_START = 20;
    var LKK_COL_END = 37;

    /** Последняя отрисовка: для сравнения и экспорта. */
    var lastRenderContext = null;

    function buildRowColumnCache(sampleRow) {
        rowColumnCache = new Map();
        if (!sampleRow) return;
        for (var key in sampleRow) {
            rowColumnCache.set(normalizeHeaderName(key), key);
        }
    }

    function isLikelyDateColumn(columnName) {
        if (!columnName) return false;
        return /начало работы методикой|дата|окончан/i.test(String(columnName));
    }

    function padDatePart(n) {
        return String(n).padStart(2, "0");
    }

    function formatDateDdMmYyyy(d, m, y) {
        return padDatePart(d) + "." + padDatePart(m) + "." + y;
    }

    function tryNormalizeExcelSerial(value, columnName) {
        if (typeof value !== "number" || !isFinite(value)) return null;
        if (!isLikelyDateColumn(columnName)) return null;
        if (typeof XLSX === "undefined" || !XLSX.SSF || !XLSX.SSF.parse_date_code) return null;
        var dc = XLSX.SSF.parse_date_code(value);
        if (!dc || dc.y < 1900 || dc.y > 2100) return null;
        return formatDateDdMmYyyy(dc.d, dc.m, dc.y);
    }

    function tryNormalizeDateString(text, columnName) {
        if (text === undefined || text === null) return null;
        var s = String(text).trim();
        if (!s) return null;
        if (!isLikelyDateColumn(columnName) && !/^\d{4}-\d{2}-\d{2}/.test(s)) return null;
        if (/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(s)) return s;
        var iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (iso) return iso[3] + "." + iso[2] + "." + iso[1];
        return null;
    }

    function normalizeFieldValue(raw, columnName) {
        if (raw === undefined || raw === null) return "";
        if (raw instanceof Date) {
            if (isNaN(raw.getTime())) return "";
            return formatDateDdMmYyyy(raw.getDate(), raw.getMonth() + 1, raw.getFullYear());
        }
        if (typeof raw === "number") {
            var serial = tryNormalizeExcelSerial(raw, columnName);
            return serial !== null ? serial : String(raw);
        }
        var asDate = tryNormalizeDateString(raw, columnName);
        return asDate !== null ? asDate : String(raw);
    }

    function getRawRowCell(row, columnName) {
        if (!row) return null;
        if (row[columnName] !== undefined && row[columnName] !== null) return row[columnName];
        if (rowColumnCache) {
            var cachedKey = rowColumnCache.get(normalizeHeaderName(columnName));
            if (cachedKey !== undefined && row[cachedKey] !== undefined && row[cachedKey] !== null) {
                return row[cachedKey];
            }
        }
        var normTarget = normalizeHeaderName(columnName);
        for (var key in row) {
            if (normalizeHeaderName(key) === normTarget) {
                return row[key];
            }
        }
        return null;
    }

    function getRowValue(row, columnName) {
        var raw = getRawRowCell(row, columnName);
        if (raw === undefined || raw === null) return "";
        return normalizeFieldValue(raw, columnName);
    }

    function addFilterValuesFromRow(row, filterCol, outSet) {
        if (!outSet) return;
        var val = getRowValue(row, filterCol);
        if (isListSplittableColumn(filterCol)) {
            splitListCellValue(val, filterCol).forEach(function (p) {
                if (p && p !== "Не заполнено") outSet.add(p);
            });
        } else if (val !== "" && val !== undefined) {
            outSet.add(val);
        }
    }

    function resetFilterIndexes() {
        filterUniquesIndex = {};
        filterRowIndex = {};
        CONFIG.filters.forEach(function (col) {
            filterUniquesIndex[col] = new Set();
            filterRowIndex[col] = new Map();
        });
    }

    function appendRowIdToFilterIndex(col, value, rowIndex) {
        if (!filterRowIndex || !filterRowIndex[col]) return;
        var list = filterRowIndex[col].get(value);
        if (!list) {
            list = [];
            filterRowIndex[col].set(value, list);
        }
        if (list.length && list[list.length - 1] === rowIndex) return;
        list.push(rowIndex);
    }

    function indexRowForFilters(rowIndex, row) {
        for (var f = 0; f < CONFIG.filters.length; f++) {
            var col = CONFIG.filters[f];
            var val = getRowValue(row, col);
            if (isListSplittableColumn(col)) {
                splitListCellValue(val, col).forEach(function (p) {
                    if (p && p !== "Не заполнено") {
                        filterUniquesIndex[col].add(p);
                        appendRowIdToFilterIndex(col, p, rowIndex);
                    }
                });
            } else if (val !== "" && val !== undefined) {
                filterUniquesIndex[col].add(val);
                appendRowIdToFilterIndex(col, val, rowIndex);
            }
        }
    }

    function finalizeFilterRowIndex() {
        if (!filterRowIndex) return;
        CONFIG.filters.forEach(function (col) {
            filterRowIndex[col].forEach(function (arr, value) {
                if (!arr || arr.length < 2) return;
                var unique = [];
                var prev = -1;
                for (var i = 0; i < arr.length; i++) {
                    var id = arr[i];
                    if (id !== prev) {
                        unique.push(id);
                        prev = id;
                    }
                }
                filterRowIndex[col].set(value, unique);
            });
        });
    }

    function rebuildFilterUniquesIndexSync() {
        resetFilterIndexes();
        for (var i = 0; i < globalData.length; i++) {
            indexRowForFilters(i, globalData[i]);
        }
        finalizeFilterRowIndex();
    }

    function rebuildFilterUniquesIndex(done) {
        if (!done) {
            rebuildFilterUniquesIndexSync();
            return;
        }
        resetFilterIndexes();
        var idx = 0;
        var total = globalData.length;
        var chunk = Math.max(100, CONFIG.largeFileIndexingChunk | 0);
        var statusEl = document.getElementById("status");
        var showProgress = total > CONFIG.largeFileRowThreshold;

        function step() {
            var end = Math.min(idx + chunk, total);
            for (; idx < end; idx++) {
                indexRowForFilters(idx, globalData[idx]);
            }
            if (statusEl && showProgress) {
                statusEl.innerText =
                    "Справочник для фильтров: " + idx + " / " + total + " строк…";
            }
            if (idx < total) {
                setTimeout(step, 0);
            } else {
                finalizeFilterRowIndex();
                done();
            }
        }
        if (total <= CONFIG.largeFileRowThreshold) {
            rebuildFilterUniquesIndexSync();
            done();
        } else {
            setTimeout(step, 0);
        }
    }

    function intersectRowIdsForFilterState(state, skipColumn) {
        if (!filterRowIndex || !state) return null;
        var activeCols = [];
        for (var i = 0; i < CONFIG.filters.length; i++) {
            var col = CONFIG.filters[i];
            if (col === skipColumn) continue;
            if (state[col] && state[col].size > 0) activeCols.push(col);
        }
        if (!activeCols.length) return null;

        var result = null;
        for (var c = 0; c < activeCols.length; c++) {
            var col = activeCols[c];
            var colUnion = new Set();
            state[col].forEach(function (val) {
                var list = filterRowIndex[col] && filterRowIndex[col].get(val);
                if (!list) return;
                for (var j = 0; j < list.length; j++) colUnion.add(list[j]);
            });
            if (colUnion.size === 0) return new Set();
            if (result === null) {
                result = colUnion;
            } else {
                var smaller = result.size <= colUnion.size ? result : colUnion;
                var larger = smaller === result ? colUnion : result;
                var inter = new Set();
                smaller.forEach(function (rowId) {
                    if (larger.has(rowId)) inter.add(rowId);
                });
                result = inter;
                if (result.size === 0) return result;
            }
        }
        return result;
    }

    function countRowsForFilterState(state, skipColumn) {
        var ids = intersectRowIdsForFilterState(state, skipColumn);
        if (ids === null) return globalData.length;
        return ids.size;
    }

    function collectAllowedValuesFromRowIds(rowIds, targetCol) {
        if (rowIds === null) {
            if (filterUniquesIndex && filterUniquesIndex[targetCol]) {
                return new Set(filterUniquesIndex[targetCol]);
            }
            return new Set();
        }
        var allowed = new Set();
        if (rowIds.size === 0) return allowed;
        rowIds.forEach(function (rowIndex) {
            if (globalData[rowIndex]) addFilterValuesFromRow(globalData[rowIndex], targetCol, allowed);
        });
        return allowed;
    }

    function syncGroupTestsButtonUi() {
        var btn = document.getElementById("toggleGroupBtn");
        if (!btn) return;
        if (CONFIG.groupTests) {
            btn.classList.add("active");
            btn.innerText = "Группы тестов: Вкл";
        } else {
            btn.classList.remove("active");
            btn.innerText = "Группы тестов: Выкл";
        }
    }

    function applyLargeFileDefaults() {
        if (globalData.length < CONFIG.largeFileRowThreshold) return;
        if (!CONFIG.groupTests) {
            CONFIG.groupTests = true;
            syncGroupTestsButtonUi();
        }
    }

    function useProfileSplitForCards() {
        return CONFIG.showProfilesInCards && !CONFIG.groupTests;
    }

    function countVirtualCards(filteredData, splitCol) {
        var profileCol =
            CONFIG.cardGroupByColumns && CONFIG.cardGroupByColumns.length
                ? CONFIG.cardGroupByColumns[0]
                : "Код профиля тестов";
        if (CONFIG.groupTests || !CONFIG.showProfilesInCards) {
            var seen = new Set();
            for (var i = 0; i < filteredData.length; i++) {
                var t = String(getRowValue(filteredData[i], splitCol)).trim();
                if (!t) t = "Не заполнено";
                seen.add(t);
            }
            return seen.size;
        }
        var total = 0;
        var cap = CONFIG.maxVirtualCards | 0;
        for (var j = 0; j < filteredData.length; j++) {
            var parts = splitListCellValue(getRowValue(filteredData[j], profileCol), profileCol);
            total += parts.length;
            if (cap > 0 && total > cap) return total;
        }
        return total;
    }

    function readWorkbookArrayBuffer(arrayBuffer) {
        return XLSX.read(arrayBuffer, {
            type: "array",
            cellDates: false,
            cellStyles: false,
            sheetStubs: true
        });
    }

    function cloneFilterSets(source) {
        var out = {};
        for (var col in source) {
            out[col] = new Set(source[col] || []);
        }
        return out;
    }

    function filterRowsBySelectedFilters(data, skipColumn, filterState) {
        var state = filterState || selectedFilters;
        var any = false;
        for (var col in state) {
            if (col === skipColumn) continue;
            if (state[col].size > 0) {
                any = true;
                break;
            }
        }
        if (!any) return data;

        if (filterRowIndex && data === globalData) {
            var ids = intersectRowIdsForFilterState(state, skipColumn);
            if (ids === null) return data;
            var indexed = [];
            ids.forEach(function (rowIndex) {
                if (data[rowIndex] !== undefined) indexed.push(data[rowIndex]);
            });
            return indexed;
        }

        var out = [];
        for (var i = 0; i < data.length; i++) {
            var row = data[i];
            var ok = true;
            for (var c in state) {
                if (c === skipColumn) continue;
                if (state[c].size > 0 && !rowMatchesFilterColumn(row, c, state)) {
                    ok = false;
                    break;
                }
            }
            if (ok) out.push(row);
        }
        return out;
    }

    function collectAllowedValuesForColumn(data, targetCol) {
        var allowed = new Set();
        for (var i = 0; i < data.length; i++) {
            addFilterValuesFromRow(data[i], targetCol, allowed);
        }
        return allowed;
    }

    function isListSplittableColumn(columnName) {
        return (CONFIG.cardGroupByColumns || []).indexOf(columnName) !== -1;
    }

    /** В OPP-10587 в «Код профиля тестов» часто несколько кодов через запятую в одной ячейке. */
    function splitListCellValue(raw, columnName) {
        if (!isListSplittableColumn(columnName)) {
            var single = raw === undefined || raw === null ? "" : String(raw).trim();
            return single ? [single] : ["Не заполнено"];
        }
        if (raw === undefined || raw === null || String(raw).trim() === "") return ["Не заполнено"];
        var parts = String(raw)
            .split(/[,;]/)
            .map(function (p) {
                return p.trim();
            })
            .filter(Boolean);
        return parts.length ? parts : ["Не заполнено"];
    }

    function setRowColumnValue(row, columnName, value) {
        var clone = Object.assign({}, row);
        if (clone[columnName] !== undefined) {
            clone[columnName] = value;
            return clone;
        }
        var normTarget = columnName.toLowerCase().replace(/\s+/g, " ").trim();
        for (var key in row) {
            if (key.toLowerCase().replace(/\s+/g, " ").trim() === normTarget) {
                clone = Object.assign({}, row);
                clone[key] = value;
                return clone;
            }
        }
        clone[columnName] = value;
        return clone;
    }

    function pushRowToTestMap(testMap, row, splitCol, profileCol, profileOverride) {
        var testName = getRowValue(row, splitCol);
        if (!String(testName).trim()) testName = "Не заполнено";
        else testName = String(testName).trim();

        var groupMatch = {};
        groupMatch[splitCol] = testName;

        var key;
        if (CONFIG.groupTests || !CONFIG.showProfilesInCards) {
            key = splitCol + "\u0002" + testName;
        } else {
            var prof =
                profileOverride !== null && profileOverride !== undefined
                    ? String(profileOverride).trim()
                    : String(getRowValue(row, profileCol)).trim();
            if (!prof) prof = "Не заполнено";
            groupMatch[profileCol] = prof;
            key = splitCol + "\u0002" + testName + "\u0001" + profileCol + "\u0002" + prof;
        }

        if (!testMap.has(key)) {
            testMap.set(key, {
                rows: [],
                testName: testName,
                groupMatch: groupMatch
            });
        }
        testMap.get(key).rows.push({ row: row, profileOverride: profileOverride });
    }

    function accumulateTestMapFromFilteredData(filteredData, testMap, splitCol) {
        var profileCol =
            CONFIG.cardGroupByColumns && CONFIG.cardGroupByColumns.length
                ? CONFIG.cardGroupByColumns[0]
                : "Код профиля тестов";
        for (var i = 0; i < filteredData.length; i++) {
            var row = filteredData[i];
            if (CONFIG.groupTests || !CONFIG.showProfilesInCards) {
                pushRowToTestMap(testMap, row, splitCol, profileCol, null);
                continue;
            }
            var parts = splitListCellValue(getRowValue(row, profileCol), profileCol);
            for (var p = 0; p < parts.length; p++) {
                pushRowToTestMap(testMap, row, splitCol, profileCol, parts[p]);
            }
        }
    }

    function getBundleComposedValue(entry, spec, profileCol) {
        var row = entry.row;
        if (
            profileCol &&
            spec.key === profileCol &&
            entry.profileOverride !== null &&
            entry.profileOverride !== undefined
        ) {
            return formatDisplayValue(entry.profileOverride);
        }
        return getComposedRowValue(row, spec);
    }

    function rowMatchesFilterColumn(row, col, filterState) {
        var state = filterState || selectedFilters;
        if (!state[col] || state[col].size === 0) return true;
        var val = getRowValue(row, col);
        if (isListSplittableColumn(col)) {
            return splitListCellValue(val, col).some(function (p) {
                return state[col].has(p);
            });
        }
        return state[col].has(val);
    }

    function syncCheckboxForFilterValue(filterCol, value, checked) {
        var dd = document.getElementById("drop_" + sanitizeId(filterCol));
        if (!dd) return;
        dd.querySelectorAll(".dropdown-item input[type=checkbox]").forEach(function (cb) {
            if (cb.value === value) cb.checked = !!checked;
        });
    }

    function filtersArePending() {
        for (var i = 0; i < CONFIG.filters.length; i++) {
            var col = CONFIG.filters[i];
            var a = appliedFilters[col] || new Set();
            var s = selectedFilters[col] || new Set();
            if (a.size !== s.size) return true;
            var vals = Array.from(s);
            for (var j = 0; j < vals.length; j++) {
                if (!a.has(vals[j])) return true;
            }
        }
        return false;
    }

    function updateApplyButtonUi() {
        var btn = document.getElementById("applyFiltersBtn");
        if (!btn) return;
        btn.classList.toggle("pending", filtersArePending());
    }

    function syncAppliedFromSelected() {
        CONFIG.filters.forEach(function (col) {
            appliedFilters[col] = new Set(selectedFilters[col] || []);
        });
    }

    /** Любой символ \ в тексте ячейки — разделитель: показываем следующий фрагмент с новой строки. */
    function formatDisplayValue(s) {
        if (s === undefined || s === null) return "";
        return String(s)
            .split("\\")
            .map(function (part) { return part.trim(); })
            .filter(function (part) { return part !== ""; })
            .join("\n")
            .trim();
    }

    function escapeAttr(str) {
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;");
    }

    function escapeHtml(str) {
        if (str === undefined || str === null) return "";
        var d = document.createElement("div");
        d.textContent = String(str);
        return d.innerHTML;
    }

    function escapeRegExp(s) {
        return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    /** Подсветка фрагмента поиска (безопасная разметка). */
    function buildHighlightedHtml(plainText, query) {
        if (!plainText) return "";
        var q = query ? String(query).trim() : "";
        if (!q) return escapeHtml(plainText);
        var re = new RegExp("(" + escapeRegExp(q) + ")", "gi");
        var parts = String(plainText).split(re);
        return parts.map(function (part, i) {
            if (i % 2 === 1) {
                return "<mark class=\"search-highlight\">" + escapeHtml(part) + "</mark>";
            }
            return escapeHtml(part);
        }).join("");
    }

    /** Длинный текст: свёртка + подсветка; короткий: только подсветка. */
    function applyRichValueContent(el, plainText, searchQuery) {
        if (!el) return;
        el.dataset.plaintext = plainText;
        var q = searchQuery !== undefined ? searchQuery : lastResultsSearchQuery || "";
        var maxLen = CONFIG.expandLongFieldAfter;
        var multiline = plainText.indexOf("\n") !== -1;
        function applyDiffStyle() {
            if (el.dataset.differ === "1") {
                el.style.color = "var(--highlight-red)";
                el.style.fontWeight = "700";
            } else {
                el.style.color = "";
                el.style.fontWeight = "";
            }
        }
        function removeExpandControls() {
            el.querySelectorAll(".card-value-expand-wrap").forEach(function (w) {
                w.remove();
            });
        }
        function needsLongCollapse() {
            return plainText.length > maxLen;
        }
        function renderExpanded() {
            removeExpandControls();
            el.innerHTML = buildHighlightedHtml(plainText, q);
            el.classList.toggle("card-value--multiline", multiline || needsLongCollapse());
            if (needsLongCollapse() || multiline) el.classList.add("card-value--block");
            else el.classList.remove("card-value--block");
            applyDiffStyle();
            if (needsLongCollapse()) {
                var wrap = document.createElement("span");
                wrap.className = "card-value-expand-wrap";
                var btnCol = document.createElement("button");
                btnCol.type = "button";
                btnCol.className = "card-value-expand";
                btnCol.textContent = "Свернуть";
                btnCol.addEventListener("click", function () {
                    renderCollapsed();
                });
                wrap.appendChild(btnCol);
                el.appendChild(wrap);
            }
        }
        function renderCollapsed() {
            removeExpandControls();
            var preview = plainText.slice(0, maxLen).trim() + "…";
            el.innerHTML = buildHighlightedHtml(preview, q);
            el.classList.remove("card-value--multiline", "card-value--block");
            applyDiffStyle();
            var wrap = document.createElement("span");
            wrap.className = "card-value-expand-wrap";
            var btnExp = document.createElement("button");
            btnExp.type = "button";
            btnExp.className = "card-value-expand";
            btnExp.textContent = "Показать полностью";
            btnExp.addEventListener("click", function () {
                renderExpanded();
            });
            wrap.appendChild(btnExp);
            el.appendChild(wrap);
        }
        if (plainText.length <= maxLen) {
            removeExpandControls();
            el.innerHTML = buildHighlightedHtml(plainText, q);
            el.classList.toggle("card-value--multiline", multiline);
            if (multiline) el.classList.add("card-value--block");
            else el.classList.remove("card-value--block");
            applyDiffStyle();
            return;
        }
        renderCollapsed();
    }

    function isProfileCodesField(fieldKey) {
        return fieldKey === CONFIG.profileCodesField;
    }

    function parseProfileCodesList(plainText) {
        if (!plainText) return [];
        var parts = String(plainText)
            .split(/[,;\n]/)
            .map(function (p) {
                return p.trim();
            })
            .filter(Boolean);
        var seen = new Set();
        var out = [];
        parts.forEach(function (p) {
            if (seen.has(p)) return;
            seen.add(p);
            out.push(p);
        });
        return out;
    }

    /** «Код профиля тестов»: чипы, поиск и свёртка длинных списков. */
    function applyProfileCodesFieldContent(el, plainText, searchQuery) {
        if (!el) return;
        el.dataset.plaintext = plainText;
        el.dataset.fieldType = "profile-codes";
        var q = searchQuery !== undefined ? searchQuery : lastResultsSearchQuery || "";
        var codes = parseProfileCodesList(plainText);
        var threshold = CONFIG.profileCodesCollapseAfter | 0;
        var previewN = CONFIG.profileCodesPreviewCount | 0;
        if (previewN < 1) previewN = 5;
        var forceExpanded = el.dataset.profileCodesExpanded === "1";
        var savedChipQ = el.dataset.profileCodesChipSearch || "";

        function applyDiffStyle() {
            if (el.dataset.differ === "1") {
                el.style.color = "var(--highlight-red)";
                el.style.fontWeight = "700";
            } else {
                el.style.color = "";
                el.style.fontWeight = "";
            }
        }

        function highlightCode(code, highlightQuery) {
            var hq = highlightQuery ? String(highlightQuery).trim() : "";
            if (!hq) return escapeHtml(code);
            var re = new RegExp("(" + escapeRegExp(hq) + ")", "gi");
            var parts = String(code).split(re);
            return parts
                .map(function (part, i) {
                    if (i % 2 === 1) {
                        return "<mark class=\"search-highlight\">" + escapeHtml(part) + "</mark>";
                    }
                    return escapeHtml(part);
                })
                .join("");
        }

        function makeChip(code, highlightQuery) {
            var chip = document.createElement("span");
            chip.className = "profile-chip";
            chip.dataset.code = code;
            chip.innerHTML = highlightCode(code, highlightQuery);
            return chip;
        }

        el.innerHTML = "";
        el.classList.add("card-value--block");
        applyDiffStyle();

        if (codes.length === 0) {
            el.textContent = "";
            return;
        }

        if (codes.length <= threshold) {
            var wrapShort = document.createElement("div");
            wrapShort.className = "profile-codes-wrap";
            var chipsShort = document.createElement("div");
            chipsShort.className = "profile-codes-chips";
            codes.forEach(function (code) {
                chipsShort.appendChild(makeChip(code, q));
            });
            wrapShort.appendChild(chipsShort);
            el.appendChild(wrapShort);
            return;
        }

        var wrap = document.createElement("div");
        wrap.className = "profile-codes-wrap";

        if (!forceExpanded) {
            var summary = document.createElement("div");
            summary.className = "profile-codes-summary";
            summary.textContent = "Кодов профиля: " + codes.length;
            wrap.appendChild(summary);
            var preview = document.createElement("div");
            preview.className = "profile-codes-chips";
            codes.slice(0, previewN).forEach(function (code) {
                preview.appendChild(makeChip(code, q));
            });
            wrap.appendChild(preview);
            if (codes.length > previewN) {
                var more = document.createElement("span");
                more.className = "profile-codes-summary";
                more.textContent = "и ещё " + (codes.length - previewN) + "…";
                wrap.appendChild(more);
            }
            var actionsCol = document.createElement("div");
            actionsCol.className = "profile-codes-actions";
            var btnShow = document.createElement("button");
            btnShow.type = "button";
            btnShow.className = "profile-codes-btn";
            btnShow.textContent = "Показать все коды";
            btnShow.addEventListener("click", function () {
                el.dataset.profileCodesExpanded = "1";
                applyProfileCodesFieldContent(el, plainText, q);
            });
            actionsCol.appendChild(btnShow);
            wrap.appendChild(actionsCol);
            el.appendChild(wrap);
            return;
        }

        var toolbar = document.createElement("div");
        toolbar.className = "profile-codes-toolbar";
        var searchInp = document.createElement("input");
        searchInp.type = "search";
        searchInp.className = "profile-codes-search-input";
        searchInp.placeholder = "Поиск среди кодов…";
        searchInp.value = savedChipQ;
        searchInp.setAttribute("aria-label", "Поиск кода профиля в карточке");
        var meta = document.createElement("span");
        meta.className = "profile-codes-meta";
        toolbar.appendChild(searchInp);
        toolbar.appendChild(meta);
        wrap.appendChild(toolbar);

        var chipsAll = document.createElement("div");
        chipsAll.className = "profile-codes-chips";

        function renderChips() {
            var chipQ = searchInp.value.trim().toLowerCase();
            el.dataset.profileCodesChipSearch = searchInp.value;
            chipsAll.innerHTML = "";
            var visible = 0;
            codes.forEach(function (code) {
                var matchChip = !chipQ || code.toLowerCase().indexOf(chipQ) !== -1;
                if (!matchChip) return;
                visible++;
                chipsAll.appendChild(makeChip(code, q || chipQ));
            });
            meta.textContent =
                chipQ && visible < codes.length
                    ? visible + " из " + codes.length
                    : codes.length + " кодов";
            chipsAll.style.display = visible ? "flex" : "none";
        }

        searchInp.addEventListener("input", renderChips);
        wrap.appendChild(chipsAll);

        var actions = document.createElement("div");
        actions.className = "profile-codes-actions";
        var btnHide = document.createElement("button");
        btnHide.type = "button";
        btnHide.className = "profile-codes-btn";
        btnHide.textContent = "Свернуть";
        btnHide.addEventListener("click", function () {
            el.dataset.profileCodesExpanded = "0";
            el.dataset.profileCodesChipSearch = "";
            applyProfileCodesFieldContent(el, plainText, q);
        });
        var btnCopy = document.createElement("button");
        btnCopy.type = "button";
        btnCopy.className = "profile-codes-btn";
        btnCopy.textContent = "Копировать все";
        btnCopy.addEventListener("click", function () {
            var text = codes.join("\n");
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text);
            }
        });
        actions.appendChild(btnHide);
        actions.appendChild(btnCopy);
        wrap.appendChild(actions);

        el.appendChild(wrap);
        renderChips();
    }

    function saveFiltersState() {
        try {
            var draft = {};
            var applied = {};
            for (var col in selectedFilters) {
                draft[col] = Array.from(selectedFilters[col] || []);
            }
            for (var c in appliedFilters) {
                applied[c] = Array.from(appliedFilters[c] || []);
            }
            localStorage.setItem(
                CONFIG.filtersStorageKey,
                JSON.stringify({ draft: draft, applied: applied, v: 2 })
            );
        } catch (e) {}
    }

    function restoreFiltersState() {
        try {
            var raw = localStorage.getItem(CONFIG.filtersStorageKey);
            if (!raw) return;
            var o = JSON.parse(raw);
            var draft = o.v === 2 ? o.draft : o;
            var applied = o.v === 2 ? o.applied : o;
            CONFIG.filters.forEach(function (col) {
                if (!selectedFilters[col]) selectedFilters[col] = new Set();
                if (!appliedFilters[col]) appliedFilters[col] = new Set();
                selectedFilters[col].clear();
                appliedFilters[col].clear();
                if (draft && Array.isArray(draft[col])) {
                    draft[col].forEach(function (v) {
                        selectedFilters[col].add(v);
                    });
                }
                if (applied && Array.isArray(applied[col])) {
                    applied[col].forEach(function (v) {
                        appliedFilters[col].add(v);
                    });
                }
                var dd = document.getElementById("drop_" + sanitizeId(col));
                if (dd) {
                    dd.querySelectorAll(".dropdown-item input[type=checkbox]").forEach(function (cb) {
                        cb.checked = selectedFilters[col].has(cb.value);
                    });
                }
                updateFilterSelectionClearUi(col);
                updateFilterInputSelectionUi(col);
            });
            updateApplyButtonUi();
        } catch (e) {}
    }

    function clearOneFilter(filterCol) {
        if (!selectedFilters[filterCol]) return;
        selectedFilters[filterCol].clear();
        var dd = document.getElementById("drop_" + sanitizeId(filterCol));
        if (dd) {
            dd.querySelectorAll(".dropdown-item input[type=checkbox]").forEach(function (cb) {
                cb.checked = false;
            });
        }
        var inp = document.querySelector('.filter-search-input[data-filter-col="' + sanitizeId(filterCol) + '"]');
        if (inp) {
            inp.placeholder = "Выбрать варианты (0)";
            inp.value = "";
            if (dd) renderFilterDropdown(dd, filterCol, inp, "");
        }
        updateFilterSelectionClearUi(filterCol);
        updateFilterInputSelectionUi(filterCol);
        saveFiltersState();
        updateCascadeDropdowns();
        updateApplyButtonUi();
    }

    function removeOneFilterValue(filterCol, value) {
        if (!filterCol || value === undefined) return;
        if (selectedFilters[filterCol]) selectedFilters[filterCol].delete(value);
        if (appliedFilters[filterCol]) appliedFilters[filterCol].delete(value);
        syncCheckboxForFilterValue(filterCol, value, false);
        updateFilterSelectionClearUi(filterCol);
        updateFilterInputSelectionUi(filterCol);
        saveFiltersState();
        updateCascadeDropdowns();
        applyFiltersAndRender();
    }

    function updateFilterSelectionClearUi(filterCol) {
        if (!filterCol || !selectedFilters[filterCol]) return;
        var btn = document.querySelector(
            '.filter-selection-clear[data-filter-col="' + sanitizeId(filterCol) + '"]'
        );
        if (!btn) return;
        btn.style.display = selectedFilters[filterCol].size > 0 ? "flex" : "none";
    }

    function updateFilterInputSelectionUi(filterCol) {
        if (!filterCol) return;
        var count = selectedFilters[filterCol] ? selectedFilters[filterCol].size : 0;
        var sid = sanitizeId(filterCol);
        var inp = document.querySelector('.filter-search-input[data-filter-col="' + sid + '"]');
        var badge = document.querySelector('.filter-selection-count[data-filter-col="' + sid + '"]');
        if (badge) {
            if (count > 0) {
                badge.textContent = String(count);
                badge.classList.add("visible");
                badge.setAttribute("title", "Выбрано вариантов: " + count);
                badge.setAttribute("aria-label", "Выбрано вариантов: " + count);
            } else {
                badge.textContent = "";
                badge.classList.remove("visible");
                badge.removeAttribute("title");
                badge.removeAttribute("aria-label");
            }
        }
        if (inp) {
            inp.classList.toggle("has-selection-count", count > 0);
            if (!inp.value.trim()) {
                inp.placeholder =
                    count > 0 ? "Выбрано вариантов: " + count : "Выбрать варианты (0)";
            }

    function getProfileCodeFromTestObj(testObj, splitCol) {
        var profileCol =
            (CONFIG.cardGroupByColumns && CONFIG.cardGroupByColumns.length
                ? CONFIG.cardGroupByColumns[0]
                : "Код профиля тестов");
        if (testObj.groupMatch && testObj.groupMatch[profileCol] !== undefined) {
            return String(testObj.groupMatch[profileCol]).trim() || "Не заполнено";
        }
        if (testObj.params && testObj.params[profileCol]) {
            return String(testObj.params[profileCol]).trim() || "Не заполнено";
        }
        return "Не заполнено";
    }

    function getTestProfileKey(testName, groupMatch, splitCol) {
        var parts = [splitCol + "\u0002" + String(testName || "").trim()];
        (CONFIG.cardGroupByColumns || []).forEach(function (col) {
            if (col === splitCol) return;
            if (!CONFIG.showProfilesInCards) return;
            var v = groupMatch && groupMatch[col];
            parts.push(
                col + "\u0002" + (v !== undefined && v !== null ? String(v).trim() : "Не заполнено")
            );
        });
        return parts.join("\u0001");
    }

    function mergeCardParamsFields(targetParams, sourceParams) {
        if (!sourceParams) return;
        for (var k in sourceParams) {
            if (!Object.prototype.hasOwnProperty.call(sourceParams, k)) continue;
            var sv = sourceParams[k];
            if (sv === undefined || String(sv).trim() === "") continue;
            if (!targetParams[k] || String(targetParams[k]).trim() === "") {
                targetParams[k] = sv;
                continue;
            }
            if (String(targetParams[k]).trim() === String(sv).trim()) continue;
            var sep = CONFIG.multiRowValueSep;
            var set = new Set();
            String(targetParams[k])
                .split(sep)
                .map(function (x) {
                    return String(x).trim();
                })
                .filter(Boolean)
                .forEach(function (x) {
                    set.add(x);
                });
            String(sv)
                .split(sep)
                .map(function (x) {
                    return String(x).trim();
                })
                .filter(Boolean)
                .forEach(function (x) {
                    set.add(x);
                });
            targetParams[k] = Array.from(set)
                .sort(function (a, b) {
                    return a.localeCompare(b, "ru", { numeric: true });
                })
                .join(sep);
        }
    }

    function dedupeTestListByTestProfile(testList, splitCol) {
        var map = new Map();
        testList.forEach(function (obj) {
            var key = getTestProfileKey(obj.testName, obj.groupMatch, splitCol);
            if (!map.has(key)) {
                map.set(key, {
                    testName: obj.testName,
                    groupMatch: obj.groupMatch,
                    params: Object.assign({}, obj.params)
                });
            } else {
                mergeCardParamsFields(map.get(key).params, obj.params);
            }
        });
        return Array.from(map.values());
    }

    /** Сигнатура содержимого карточки (без имени теста) — для слияния полных дублей. */
    function getTestObjContentSignature(testObj, splitCol, displayList) {
        return displayList
            .map(function (displayItem) {
                return getDisplaySpec(displayItem);
            })
            .filter(function (spec) {
                return spec.key !== splitCol;
            })
            .map(function (spec) {
                return spec.key + ":::" + String((testObj.params && testObj.params[spec.key]) || "").trim();
            })
            .join("|||");
    }

    function dedupeTestListExact(testList, splitCol, displayList) {
        var seen = new Set();
        var out = [];
        testList.forEach(function (obj) {
            var k =
                getTestProfileKey(obj.testName, obj.groupMatch, splitCol) +
                "\u0002" +
                getTestObjContentSignature(obj, splitCol, displayList);
            if (seen.has(k)) return;
            seen.add(k);
            out.push(obj);
        });
        return out;
    }

    function getFinalCardDedupeKey(cardObj, splitCol) {
        var gmTest = cardObj.groupMatch && cardObj.groupMatch[splitCol];
        var testPart;
        if (cardObj.testKeys && cardObj.testKeys.length > 1) {
            testPart = cardObj.testKeys
                .slice()
                .sort(function (a, b) {
                    return a.localeCompare(b, "ru", { numeric: true });
                })
                .join("\u0002");
        } else if (gmTest !== undefined && gmTest !== null && String(gmTest).trim() !== "") {
            testPart = String(gmTest).trim();
        } else if (cardObj.testKeys && cardObj.testKeys.length === 1) {
            testPart = String(cardObj.testKeys[0]).trim();
        } else {
            testPart = String(cardObj.headerTitle || "").trim();
        }
        return getTestProfileKey(testPart, cardObj.groupMatch, splitCol);
    }

    function dedupeFinalCardsByTestProfile(cards, splitCol) {
        var map = new Map();
        cards.forEach(function (card) {
            var key = getFinalCardDedupeKey(card, splitCol);
            if (!map.has(key)) {
                map.set(key, {
                    headerTitle: card.headerTitle,
                    testKeys: card.testKeys ? card.testKeys.slice() : [card.headerTitle],
                    groupMatch: card.groupMatch,
                    params: Object.assign({}, card.params)
                });
            } else {
                var existing = map.get(key);
                mergeCardParamsFields(existing.params, card.params);
            }
        });
        return Array.from(map.values());
    }

    function getRowCardGroupParts(row, splitCol) {
        var testVal = getRowValue(row, splitCol);
        if (testVal === undefined || String(testVal).trim() === "") testVal = "Не заполнено";
        else testVal = String(testVal).trim();

        var groupMatch = {};
        groupMatch[splitCol] = testVal;

        var keyParts = [splitCol + "\u0002" + testVal];
        (CONFIG.cardGroupByColumns || []).forEach(function (col) {
            if (col === splitCol) return;
            var v = getRowValue(row, col);
            if (v === undefined || String(v).trim() === "") v = "Не заполнено";
            else v = String(v).trim();
            groupMatch[col] = v;
            keyParts.push(col + "\u0002" + v);
        });

        return {
            key: keyParts.join("\u0001"),
            testName: testVal,
            groupMatch: groupMatch
        };
    }

    function rowMatchesCardGroup(row, groupMatch, splitCol) {
        if (!groupMatch) return true;
        for (var col in groupMatch) {
            if (!Object.prototype.hasOwnProperty.call(groupMatch, col)) continue;
            var expected = String(groupMatch[col]).trim();
            var rv = getRowValue(row, col);
            if (isListSplittableColumn(col)) {
                if (splitListCellValue(rv, col).indexOf(expected) === -1) return false;
            } else {
                if (rv === undefined || String(rv).trim() === "") rv = "Не заполнено";
                else rv = String(rv).trim();
                if (rv !== expected) return false;
            }
        }
        return true;
    }

    function applySheetFromWorkbook(sheetName) {
        if (!pendingWorkbook || !sheetName) return;
        var ws = pendingWorkbook.Sheets[sheetName];
        if (!ws) return;
        var statusEl = document.getElementById("status");
        var loadToken = ++sheetLoadToken;
        try {
            setSheetHeaderFromWorksheet(ws);
            if (statusEl) statusEl.innerText = "Загрузка строк листа…";
            globalData = XLSX.utils.sheet_to_json(ws, { defval: "", blankrows: false, raw: true });
            pendingWorkbook = null;
            buildRowColumnCache(globalData[0]);
            applyLargeFileDefaults();
            if (statusEl) {
                statusEl.innerText =
                    globalData.length > CONFIG.largeFileRowThreshold
                        ? "Справочник для фильтров: 0 / " + globalData.length + " строк…"
                        : "Справочник для фильтров: " + globalData.length + " строк…";
            }
            rebuildFilterUniquesIndex(function () {
                if (loadToken !== sheetLoadToken) return;
                try {
                    updateColumnWarnings();
                    refreshActiveDisplay();
                    buildControls();
                    if (globalData.length >= CONFIG.largeFileRowThreshold) {
                        for (var col in selectedFilters) {
                            if (selectedFilters[col]) selectedFilters[col].clear();
                        }
                        for (var col in appliedFilters) {
                            if (appliedFilters[col]) appliedFilters[col].clear();
                        }
                    } else {
                        restoreFiltersState();
                    }
                    updateCascadeAndResults();
                    if (statusEl) {
                        if (globalData.length >= CONFIG.largeFileRowThreshold) {
                            statusEl.innerText =
                                "Загружено " +
                                globalData.length +
                                " строк. «Группы тестов» включены для скорости. Выберите узкий фильтр.";
                        } else {
                            statusEl.innerText =
                                "Успешно! Загружено строк: " +
                                globalData.length +
                                ". Выберите фильтры для поиска.";
                        }
                    }
                } catch (innerErr) {
                    if (statusEl) {
                        statusEl.innerText =
                            "Ошибка после загрузки: " +
                            (innerErr && innerErr.message ? innerErr.message : String(innerErr));
                    }
                    globalData = [];
                    filterUniquesIndex = null;
                    filterRowIndex = null;
                    buildControls();
                }
            });
        } catch (err) {
            if (statusEl) {
                statusEl.innerText =
                    "Ошибка обработки листа: " + (err && err.message ? err.message : String(err));
            }
            globalData = [];
            filterUniquesIndex = null;
            filterRowIndex = null;
            pendingWorkbook = null;
            buildControls();
        }
    }

    function buildFirstCardBaseline(finalCards, displayList, splitCol) {
        var firstCardValues = {};
        if (!finalCards.length) return firstCardValues;
        displayList.forEach(function (displayItem) {

    function appendRenderedCardsChunk(container, finalCards, displayList, splitCol, firstCardValues, startIdx, endIdx) {
        var frag = document.createDocumentFragment();
        for (var i = startIdx; i < endIdx; i++) {
            frag.appendChild(createCardElement(finalCards[i], i, splitCol, displayList, firstCardValues));
        }
        container.appendChild(frag);
    }

    function finishResultsRender(container, metaInfo) {
        container.appendChild(metaInfo);
        applyResultsSearch();
    }

    function startLazyCardRender(container, finalCards, displayList, splitCol, filteredData, firstCardValues, batchSize) {
        var total = finalCards.length;
        disconnectLazyObserver();
        var batch = Math.max(1, batchSize);
        var pos = Math.min(batch, total);
        appendRenderedCardsChunk(container, finalCards, displayList, splitCol, firstCardValues, 0, pos);

        var metaInfo = document.createElement("div");
        metaInfo.className = "meta-info";
        metaInfo.id = "resultsMetaLine";
        metaInfo.dataset.totalCards = String(total);
        metaInfo.dataset.filterRows = String(filteredData.length);

        if (pos >= total) {
            finishResultsRender(container, metaInfo);
            return;
        }

        var sentinel = document.createElement("div");
        sentinel.className = "lazy-sentinel";
        sentinel.id = "lazyRenderSentinel";
        sentinel.setAttribute("aria-hidden", "true");
        container.appendChild(sentinel);

        lazyRenderState = {
            finalCards: finalCards,
            displayList: displayList,
            splitCol: splitCol,
            filteredData: filteredData,
            firstCardValues: firstCardValues,
            nextIndex: pos,
            batchSize: batch,
            metaInfo: metaInfo,
            container: container
        };

        lazyObserver = new IntersectionObserver(
            function (entries) {
                entries.forEach(function (entry) {
                    if (!entry.isIntersecting || !lazyRenderState) return;
                    var st = lazyRenderState;
                    var nxt = st.nextIndex;
                    if (nxt >= st.finalCards.length) return;
                    var end = Math.min(nxt + st.batchSize, st.finalCards.length);
                    appendRenderedCardsChunk(st.container, st.finalCards, st.displayList, st.splitCol, st.firstCardValues, nxt, end);
                    st.nextIndex = end;
                    applyResultsSearch();
                    if (st.nextIndex >= st.finalCards.length) {
                        var sen = document.getElementById("lazyRenderSentinel");
                        if (sen) sen.remove();
                        var meta = st.metaInfo;
                        disconnectLazyObserver();
                        lazyRenderState = null;
                        finishResultsRender(st.container, meta);
                    }
                });
            },
            { root: null, rootMargin: "200px", threshold: 0 }
        );
        lazyObserver.observe(sentinel);
        applyResultsSearch();
    }

    function rebuildToc(finalCards) {

        if (!finalCards || finalCards.length < CONFIG.tocMinCards) {
