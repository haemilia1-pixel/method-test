    function disconnectLazyObserver() {
        if (lazyObserver) {
            lazyObserver.disconnect();
            lazyObserver = null;
        }
        lazyRenderState = null;
        var sen = document.getElementById("lazyRenderSentinel");
        if (sen) sen.remove();
    }

    function createCardElement(cardObj, index, splitCol, displayList, firstCardValues) {
        const card = document.createElement("div");
        card.className = "card";
        card.id = "card-" + index;
        card.dataset.cardIndex = String(index);
        if (cardObj.testKeys && cardObj.testKeys.length) {
            card.dataset.testKeysJson = JSON.stringify(cardObj.testKeys);
        }
        if (cardObj.groupMatch) {
            card.dataset.groupMatchJson = JSON.stringify(cardObj.groupMatch);
        }

        const headerWrap = document.createElement("div");
        headerWrap.className = "card-header-row";

        const headerFieldDiv = document.createElement("div");
        headerFieldDiv.className = "card-field full-width-header";
        headerFieldDiv.style.flex = "1";
        headerFieldDiv.style.minWidth = "0";

        const headerLabelDiv = document.createElement("div");
        headerLabelDiv.className = "card-label";
        headerLabelDiv.innerText = splitCol;

        const headerValDiv = document.createElement("div");
        headerValDiv.className = "card-value";
        applyRichValueContent(headerValDiv, cardObj.headerTitle, lastResultsSearchQuery);

        headerFieldDiv.appendChild(headerLabelDiv);
        headerFieldDiv.appendChild(headerValDiv);

        const actions = document.createElement("div");
        actions.className = "card-actions";
        const selectCb = document.createElement("input");
        selectCb.type = "checkbox";
        selectCb.className = "card-select-cb";
        selectCb.title = "Выбрать для экспорта (HTML/Excel). Для сравнения отметьте ровно две карточки.";
        selectCb.dataset.cardIndex = String(index);
        selectCb.addEventListener("change", onCardSelectChange);
        const copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.className = "btn-card-mini";
        copyBtn.textContent = "Копировать";
        copyBtn.addEventListener("click", function () {
            copyCardAsText(cardObj, splitCol, displayList);
        });
        actions.appendChild(selectCb);
        actions.appendChild(copyBtn);

        headerWrap.appendChild(headerFieldDiv);
        headerWrap.appendChild(actions);
        card.appendChild(headerWrap);

        displayList.forEach(function (displayItem) {
            const spec = getDisplaySpec(displayItem);
            if (spec.key === splitCol) return;

            let joinedText = cardObj.params[spec.key] || "";
            if (joinedText !== "") {
                const fieldDiv = document.createElement("div");
                fieldDiv.className = "card-field";

                const labelDiv = document.createElement("div");
                labelDiv.className = "card-label";
                labelDiv.innerText = spec.label;

                const valDiv = document.createElement("div");
                valDiv.className = "card-value";
                var diff =
                    index > 0 &&
                    CONFIG.highlightDifferences &&
                    joinedText !== firstCardValues[spec.key];
                valDiv.dataset.differ = diff ? "1" : "0";
                if (isProfileCodesField(spec.key)) {
                    fieldDiv.classList.add("card-field--profile-codes");
                    applyProfileCodesFieldContent(valDiv, joinedText, lastResultsSearchQuery);
                } else {
                    applyRichValueContent(valDiv, joinedText, lastResultsSearchQuery);
                }

                fieldDiv.appendChild(labelDiv);
                fieldDiv.appendChild(valDiv);
                card.appendChild(fieldDiv);
            }
        });

        return card;
    }

    function copyCardAsText(cardObj, splitCol, displayList) {
        var lines = [splitCol + ": " + cardObj.headerTitle, ""];
        displayList.forEach(function (displayItem) {
            var spec = getDisplaySpec(displayItem);
            if (spec.key === splitCol) return;
            var v = cardObj.params[spec.key];
            if (!v) return;
            lines.push(spec.label + ":\n" + v + "\n");
        });
        var text = lines.join("\n");
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).catch(function () {
                alert("Не удалось скопировать в буфер.");
            });
        } else {
            alert(text);
        }
    }

    function rowKeysFromCardElement(cardEl) {
        if (!cardEl) return [];
        if (cardEl.dataset.testKeysJson) {
            try {
                var parsed = JSON.parse(cardEl.dataset.testKeysJson);
                if (Array.isArray(parsed)) {
                    return parsed
                        .map(function (t) {

                        })
                        .filter(Boolean);
                }
            } catch (e) {}
        }
        var headerVal = cardEl.querySelector(".card-field.full-width-header .card-value");
        if (!headerVal || !headerVal.dataset.plaintext) return [];
        return String(headerVal.dataset.plaintext)
            .split(/[\n,]+/)

            })

    function updateComparePanel() {
        var panel = document.getElementById("comparePanel");
        var body = document.getElementById("comparePanelBody");
        if (!panel || !body || !lastRenderContext) return;
        if (compareSelected.length !== 2) {
            panel.classList.remove("visible");
            body.innerHTML = "";
            return;
        }
        var i0 = compareSelected[0];
        var i1 = compareSelected[1];
        var c0 = lastRenderContext.finalCards[i0];
        var c1 = lastRenderContext.finalCards[i1];
        if (!c0 || !c1) return;
        var keys = [];
        var keySet = {};
        lastRenderContext.displayList.forEach(function (item) {
            var spec = getDisplaySpec(item);
            if (spec.key === lastRenderContext.splitCol) return;
            keySet[spec.key] = spec.label;
        });
        for (var k in keySet) keys.push(k);

        var html =
            "<table><thead><tr><th>Поле</th><th>Тест 1</th><th>Тест 2</th></tr></thead><tbody>";
        keys.forEach(function (key) {
            var v0 = (c0.params[key] || "").trim();
            var v1 = (c1.params[key] || "").trim();
            var diff = v0 !== v1;
            html +=
                "<tr" +
                (diff ? ' class="diff"' : "") +
                "><td>" +
                escapeHtml(keySet[key] || key) +
                "</td><td>" +
                escapeHtml(v0).replace(/\n/g, "<br>") +
                "</td><td>" +
                escapeHtml(v1).replace(/\n/g, "<br>") +
                "</td></tr>";
        });
        html += "</tbody></table>";
        body.innerHTML =
            "<p><strong>1:</strong> " +
            escapeHtml(c0.headerTitle) +
            "</p><p><strong>2:</strong> " +
            escapeHtml(c1.headerTitle) +
            "</p>" +
            html;
        panel.classList.add("visible");
    }

    function normalizeHeaderName(name) {
        return String(name).toLowerCase().replace(/\s+/g, " ").trim();
    }

    /** Есть ли в данных столбец с таким заголовком (проход по всем строкам — для смеси файлов). */
    function columnExistsInDataset(columnName) {
        if (!globalData.length) return false;
        var target = normalizeHeaderName(columnName);
        for (var i = 0; i < globalData.length; i++) {
            var row = globalData[i];
            for (var key in row) {
                if (normalizeHeaderName(key) === target) return true;
            }
        }
        return false;
    }

    function refreshActiveDisplay() {
        activeDisplay = columnExistsInDataset(OPP10588_PZ_FIRST_COLUMN)
            ? CONFIG.displayMicro.slice()
            : CONFIG.displayStandard.slice();
    }

    /** Описание поля для отображения: одна колонка или несколько (merge). */
    function getDisplaySpec(item) {
        if (typeof item === "string") {
            return { key: item, label: item, columns: [item], sep: "\n" };
        }
        return {
            key: item.label,
            label: item.label,
            columns: item.columns || [],
            sep: item.sep !== undefined ? item.sep : "\n"
        };
    }

    /** Собрать значения из нескольких столбцов одной строки (пустые пропускаются). */
    function getComposedRowValue(row, spec) {
        if (!spec.columns || spec.columns.length === 0) return "";
        if (spec.columns.length === 1) return formatDisplayValue(getRowValue(row, spec.columns[0]));
        const parts = spec.columns
            .map(function (c) { return getRowValue(row, c); })
            .map(function (v) { return v === undefined ? "" : String(v).trim(); })
            .filter(Boolean);
        return formatDisplayValue(parts.join(spec.sep));
    }

    /** Сохранить массив заголовков из первой строки листа (для режима «Только ЛКК»). */
    function setSheetHeaderFromWorksheet(worksheet) {
        sheetHeaderRow = null;
        if (!worksheet || !worksheet["!ref"]) return;
        try {
            var range = XLSX.utils.decode_range(worksheet["!ref"]);
            var header = [];
            for (var c = range.s.c; c <= range.e.c; c++) {
                var addr = XLSX.utils.encode_cell({ r: range.s.r, c: c });
                var cell = worksheet[addr];
                var v = "";
                if (cell) {
                    if (cell.w != null && cell.w !== "") v = String(cell.w);
                    else if (cell.v != null) v = String(cell.v);
                }
                header.push(v);
            }
            sheetHeaderRow = header;
        } catch (e) {
            sheetHeaderRow = null;
        }
    }

    function getLkkHeaderSlice() {
        if (!sheetHeaderRow || sheetHeaderRow.length === 0) return [];
        var end = Math.min(LKK_COL_END, sheetHeaderRow.length - 1);
        if (LKK_COL_START > end) return [];
        return sheetHeaderRow.slice(LKK_COL_START, end + 1);
    }

    function headerNamesMatch(a, b) {
        return String(a).toLowerCase().replace(/\s+/g, " ").trim() === String(b).toLowerCase().replace(/\s+/g, " ").trim();
    }

    function stripProfileFieldFromDisplay(list) {
        if (CONFIG.showProfilesInCards) return list;
        var field = CONFIG.profileCodesField;
        return list.filter(function (item) {
            return getDisplaySpec(item).key !== field;
        });
    }

    /** Список полей для карточки: активная схема или только столбцы U–AL (с сохранением объединённых блоков). */
    function getEffectiveDisplay() {
        var list;
        if (!CONFIG.onlyLkk) {
            list = activeDisplay;
        } else {
            var headers = getLkkHeaderSlice();
            if (headers.length === 0) {
                list = activeDisplay;
            } else {
                var out = [];
                var seenKeys = {};
                headers.forEach(function (rawName) {
                    var trimmed = String(rawName).trim();
                    if (!trimmed) return;
                    var matched = null;
                    for (var i = 0; i < activeDisplay.length; i++) {
                        var spec = getDisplaySpec(activeDisplay[i]);
                        var hit = spec.columns.some(function (col) {
                            return headerNamesMatch(col, trimmed);
                        });
                        if (hit) {
                            matched = activeDisplay[i];
                            break;
                        }
                    }
                    var item = matched != null ? matched : trimmed;
                    var k = typeof item === "string" ? item : getDisplaySpec(item).key;
                    if (seenKeys[k]) return;
                    seenKeys[k] = true;
                    out.push(item);
                });
                list = out;
            }
        }
        return stripProfileFieldFromDisplay(list);
    }

    function sanitizeId(str) {
        return str.replace(/[^a-zA-Zа-яА-Я0-9]/g, '_');
    }

    function debounce(func, wait) {
        let timeout;
        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
        };
    }

    function applyCascadeToDropdown(dropdown) {
        var allowed = dropdown._cascadeAllowed;
        dropdown.querySelectorAll(".dropdown-item").forEach(function (item) {
            if (!allowed) {
                item.dataset.cascadeMatch = "true";
            } else {
                item.dataset.cascadeMatch = allowed.has(item.dataset.value) ? "true" : "false";
            }
            updateItemVisibility(item);
        });
    }

    function filterValueSearchRank(value, q) {
        if (!q) {
            return { tier: 0, pos: 0, len: String(value).length };
        }
        var s = String(value);
        var lower = s.toLowerCase();
        var pos = lower.indexOf(q);
        if (pos < 0) {
            return { tier: 9, pos: 9999, len: s.length };
        }
        var tier;
        if (lower === q) tier = 0;
        else if (pos === 0) tier = 1;
        else if (pos > 0 && /[\s,;]/.test(s.charAt(pos - 1))) tier = 2;
        else tier = 3;
        return { tier: tier, pos: pos, len: s.length };
    }

    function compareFilterListValues(a, b, q) {
        var ra = filterValueSearchRank(a, q);
        var rb = filterValueSearchRank(b, q);
        if (ra.tier !== rb.tier) return ra.tier - rb.tier;
        if (ra.pos !== rb.pos) return ra.pos - rb.pos;
        if (ra.len !== rb.len) return ra.len - rb.len;
        return String(a).localeCompare(String(b), "ru", { numeric: true });
    }

    function renderFilterDropdown(dropdown, filterCol, input, query) {
        var all = dropdown._allValues || [];
        var lazyMin = CONFIG.filterDropdownLazyMin | 0;
        var maxItems = CONFIG.filterDropdownMaxItems | 0;
        var q = String(query || "")
            .trim()
            .toLowerCase();
        var fragment = document.createDocumentFragment();

        if (all.length > lazyMin && !q) {
            var selected = selectedFilters[filterCol] ? Array.from(selectedFilters[filterCol]) : [];
            selected.forEach(function (val) {
                fragment.appendChild(createFilterDropdownItem(filterCol, val, input));
            });
            var hint = document.createElement("div");
            hint.className = "dropdown-hint";
            hint.textContent =
                "Введите поиск — всего " + all.length + " значений (в списке до " + maxItems + ")";
            fragment.appendChild(hint);
            dropdown.innerHTML = "";
            dropdown.appendChild(fragment);
            applyCascadeToDropdown(dropdown);
            return;
        }

        var list = all;
        if (q) {
            list = all.filter(function (v) {
                return String(v).toLowerCase().indexOf(q) !== -1;
            });
            list.sort(function (a, b) {
                return compareFilterListValues(a, b, q);
            });
        }
        var slice = list.slice(0, maxItems);
        slice.forEach(function (val) {
            fragment.appendChild(createFilterDropdownItem(filterCol, val, input));
        });
        if (list.length > maxItems) {
            var more = document.createElement("div");
            more.className = "dropdown-hint";
            more.textContent = "Показано " + maxItems + " из " + list.length + " — уточните запрос";
            fragment.appendChild(more);
        }
        dropdown.innerHTML = "";
        dropdown.appendChild(fragment);
        applyCascadeToDropdown(dropdown);
    }

        document.querySelectorAll('.filter-search-input').forEach(input => {
            input.value = '';
            input.placeholder = "Выбрать варианты (0)";
        });
        document.querySelectorAll('.dropdown-item input[type="checkbox"]').forEach(cb => {
            cb.checked = false;
        });
        updateAllFilterSelectionClearUi();
        saveFiltersState();
        updateCascadeDropdowns();
        applyFiltersAndRender();
    });

    document.getElementById("resultsSearchInput").addEventListener("input", function () {
        if (resultsSearchTimer) clearTimeout(resultsSearchTimer);
        resultsSearchTimer = setTimeout(function () {
            applyResultsSearch();
        }, CONFIG.resultsSearchDebounceMs);
    });
    document.getElementById("resultsSearchInput").addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
            this.value = "";
            applyResultsSearch();
            return;
        }
        if (e.key === "Enter" && this.value.trim()) {
            e.preventDefault();
            if (e.shiftKey) goResultsSearchMatch(-1);
            else goResultsSearchMatch(1);
        }
    });
    document.getElementById("resultsSearchPrev").addEventListener("click", function () {
        goResultsSearchMatch(-1);
    });
    document.getElementById("resultsSearchNext").addEventListener("click", function () {
        goResultsSearchMatch(1);
    });

    function renderResultsData(filteredData, anyFilterActive) {
        const container = document.getElementById('resultsContainer');
        const resultsToolbar = document.getElementById('resultsToolbar');
        container.innerHTML = '';
        disconnectLazyObserver();
        lastRenderContext = null;
        rebuildToc([]);

        if (!anyFilterActive) {
            if (resultsToolbar) resultsToolbar.classList.remove('visible');
            container.innerHTML = '<div class="no-data">Пожалуйста, выберите хотя бы одно значение в фильтрах выше.</div>';
            return;
        }

        if (filteredData.length === 0) {
            if (resultsToolbar) resultsToolbar.classList.remove('visible');
            container.innerHTML = '<div class="no-data">По заданному запросу ничего не найдено.</div>';
            return;
        }

        if (resultsToolbar) resultsToolbar.classList.add('visible');

        let splitCol = CONFIG.headerColumn.trim();
        if (
            useProfileSplitForCards() &&
            filteredData.length > (CONFIG.maxFilteredRowsStrictProfileMode | 0)
        ) {
            if (resultsToolbar) resultsToolbar.classList.remove("visible");
            container.innerHTML =
                '<div class="no-data">Отфильтровано ' +
                filteredData.length +
                " строк — слишком много для режима «1 профиль = 1 карточка». " +
                'Включите <strong>«Группы тестов»</strong> или добавьте фильтры.</div>';
            return;
        }
        var virtualCards = countVirtualCards(filteredData, splitCol);
        var maxVC = CONFIG.maxVirtualCards | 0;
        if (maxVC > 0 && virtualCards > maxVC) {
            if (resultsToolbar) resultsToolbar.classList.remove("visible");
            container.innerHTML =
                '<div class="no-data">Слишком много карточек (~' +
                virtualCards +
                ", лимит " +
                maxVC +
                '). Включите <strong>«Группы тестов»</strong> или сузьте фильтры.</div>';
            return;
        }

        var displayList = getEffectiveDisplay();
        const testMap = new Map();
        accumulateTestMapFromFilteredData(filteredData, testMap, splitCol);

        var profileCol =
            CONFIG.cardGroupByColumns && CONFIG.cardGroupByColumns.length
                ? CONFIG.cardGroupByColumns[0]
                : "Код профиля тестов";
        var mergeSplitCols = {};
        (CONFIG.cardGroupByColumns || []).forEach(function (c) {
            mergeSplitCols[c] = true;
        });

        // 2. Для каждой группы формируем объект с уникальными характеристиками (без лишнего копирования строк)
        let testList = [];
        testMap.forEach(function (bundle) {
            var rows = bundle.rows;
            let params = {};
            displayList.forEach(function (displayItem) {
                const spec = getDisplaySpec(displayItem);
                if (spec.key === splitCol) return;
                if (mergeSplitCols[spec.key]) {
                    if ((CONFIG.groupTests || !CONFIG.showProfilesInCards) && spec.key === profileCol) {
                        var profSet = new Set();
                        rows.forEach(function (entry) {
                            splitListCellValue(getRowValue(entry.row, profileCol), profileCol).forEach(function (p) {
                                if (p && p !== "Не заполнено") profSet.add(p);
                            });
                        });
                        if (profSet.size) {
                            params[spec.key] = Array.from(profSet)
                                .sort(function (a, b) {
                                    return a.localeCompare(b, "ru", { numeric: true });
                                })
                                .join(CONFIG.multiRowValueSep);
                        }
                    } else {
                        var single = getBundleComposedValue(rows[0], spec, profileCol);
                        single = formatDisplayValue(single);
                        if (single !== undefined && String(single).trim() !== "") {
                            params[spec.key] = single;
                        }
                    }
                    return;
                }
                let allVals = rows.map(function (entry) {
                    return getBundleComposedValue(entry, spec, profileCol);
                });
                let uniqueVals = [];
                var seenVals = new Set();
                allVals.forEach(function (v) {
                    v = formatDisplayValue(v);
                    if (v === undefined || String(v).trim() === "") return;
                    if (seenVals.has(v)) return;
                    seenVals.add(v);
                    uniqueVals.push(v);
                });
                uniqueVals.sort(function (a, b) {
                    return a.localeCompare(b, "ru", { numeric: true });
                });
                params[spec.key] = uniqueVals.join(CONFIG.multiRowValueSep);
            });
            testList.push({
                testName: bundle.testName,
                groupMatch: bundle.groupMatch,
                params: params
            });
        });

        testList = dedupeTestListByTestProfile(testList, splitCol);
        testList = dedupeTestListExact(testList, splitCol, displayList);

        testList.sort((a, b) => {
            var ka = getTestProfileKey(a.testName, a.groupMatch, splitCol);
            var kb = getTestProfileKey(b.testName, b.groupMatch, splitCol);
            return ka.localeCompare(kb, "ru", { numeric: true });
        });

        // 3. «Группы тестов: Вкл» — одна карточка на «Код теста Название теста» (профили и строки сливаются в полях)
        let finalCards = [];

        if (CONFIG.groupTests) {
            const groupMap = new Map();
            testList.forEach(function (testObj) {
                var testKey = String(testObj.testName || "").trim() || "Не заполнено";
                if (!groupMap.has(testKey)) {
                    var gm = {};
                    gm[splitCol] = testKey;
                    groupMap.set(testKey, {
                        testName: testKey,
                        params: Object.assign({}, testObj.params),
                        groupMatch: Object.assign(gm, testObj.groupMatch || {})
                    });
                } else {
                    mergeCardParamsFields(groupMap.get(testKey).params, testObj.params);
                }
            });

            groupMap.forEach(function (groupObj) {
                finalCards.push({
                    headerTitle: groupObj.testName,
                    testKeys: [groupObj.testName],
                    groupMatch: groupObj.groupMatch,
                    params: groupObj.params
                });
            });

            finalCards.sort(function (a, b) {
                return a.headerTitle.localeCompare(b.headerTitle, "ru", { numeric: true });
            });
        } else {
            // Обычный режим: 1 карточка = 1 тест
            testList.forEach(testObj => {
                finalCards.push({
                    headerTitle: testObj.testName,
                    testKeys: [testObj.testName],
                    groupMatch: testObj.groupMatch,
                    params: testObj.params
                });
            });
        }

        if (!CONFIG.groupTests) {
            finalCards = dedupeFinalCardsByTestProfile(finalCards, splitCol);
            finalCards.sort(function (a, b) {
                return getFinalCardDedupeKey(a, splitCol).localeCompare(
                    getFinalCardDedupeKey(b, splitCol),
                    "ru",
                    { numeric: true }
                );
            });
        }

        // 4. Отрисовываем карточки результатов
        compareSelected = [];
        document.querySelectorAll(".card-select-cb").forEach(function (cb) {
            cb.checked = false;
        });
        var comparePanel = document.getElementById("comparePanel");
        if (comparePanel) comparePanel.classList.remove("visible");

        var finalCardsVisible = finalCards.filter(function (cardObj) {
            return displayList.some(function (displayItem) {
                var spec = getDisplaySpec(displayItem);
                if (spec.key === splitCol) return false;
                var t = cardObj.params[spec.key];
                return t !== undefined && String(t).trim() !== "";
            });
        });

        lastRenderContext = {
            finalCards: finalCardsVisible,
            displayList: displayList,
            splitCol: splitCol,
            filteredData: filteredData
        };

        rebuildToc(finalCardsVisible);

        if (finalCardsVisible.length > 0) {
            var firstCardValues = buildFirstCardBaseline(finalCardsVisible, displayList, splitCol);
            var batch = CONFIG.lazyRenderBatch | 0;
            if (batch <= 0 || finalCardsVisible.length <= batch) {
                appendRenderedCardsChunk(container, finalCardsVisible, displayList, splitCol, firstCardValues, 0, finalCardsVisible.length);
                var metaInfo = document.createElement("div");
                metaInfo.className = "meta-info";
                metaInfo.id = "resultsMetaLine";
                metaInfo.dataset.totalCards = String(finalCardsVisible.length);
                metaInfo.dataset.filterRows = String(filteredData.length);
                container.appendChild(metaInfo);
                applyResultsSearch();
            } else {
                startLazyCardRender(container, finalCardsVisible, displayList, splitCol, filteredData, firstCardValues, batch);
            }
        } else {
            if (resultsToolbar) resultsToolbar.classList.remove("visible");
            var pillBad = document.getElementById("resultsCountPill");
            if (pillBad) pillBad.textContent = "";
            lastRenderContext = null;
            rebuildToc([]);
            container.innerHTML = '<div class="no-data">В найденных строках нет данных для отображения.</div>';
        }
    }

    function collectCardsHtmlForExport() {
        var sel = getSelectedCardIndicesForExport();
        var list;
        if (sel.length > 0) {
            list = sel
                .map(function (i) {
                    return document.getElementById("card-" + i);
                })
                .filter(function (el) {
                    return el && !el.classList.contains("filtered-out");
                });
        } else {
            list = Array.prototype.slice.call(
                document.querySelectorAll("#resultsContainer .card:not(.filtered-out)")
            );
        }
        if (!list.length) return "";
        var chunks = [];
        list.forEach(function (card) {
            var c = card.cloneNode(true);
            c.querySelectorAll(
                ".card-actions, .card-select-cb, .btn-card-mini, .card-value-expand-wrap, .card-value-expand, " +
                    ".profile-codes-toolbar, .profile-codes-actions"
            ).forEach(function (el) {
                el.remove();
            });
            c.querySelectorAll('.card-value[data-field-type="profile-codes"]').forEach(function (el) {
                var codes = parseProfileCodesList(el.dataset.plaintext || "");
                el.removeAttribute("data-field-type");
                el.className = "card-value card-value--multiline";
                el.textContent = codes.join("\n");
            });
            chunks.push(c.outerHTML);
        });
        return chunks.join("\n");
    }

    function getRowsForExportExcel() {
        var sel = getSelectedCardIndicesForExport();
        if (sel.length === 0) return currentFilteredData;
        if (!lastRenderContext || !lastRenderContext.finalCards) return currentFilteredData;
        var splitCol = lastRenderContext.splitCol;
        var cards = lastRenderContext.finalCards;
        var keySet = {};
        sel.forEach(function (i) {
            var cel = document.getElementById("card-" + i);
            if (!cel || cel.classList.contains("filtered-out")) return;
            var fc = cards[i];
            if (fc && fc.testKeys && fc.testKeys.length) {
                fc.testKeys.forEach(function (k) {
                    keySet[String(k).trim()] = true;
                });
            } else {
                rowKeysFromCardElement(cel).forEach(function (k) {
                    keySet[k] = true;
                });
            }
        });
        if (Object.keys(keySet).length === 0) return [];
        var selectedCards = sel.map(function (i) { return cards[i]; }).filter(Boolean);
        var hasGroupMatch = selectedCards.some(function (fc) {
            return fc && fc.groupMatch;
        });
        if (hasGroupMatch) {
            return currentFilteredData.filter(function (row) {
                return selectedCards.some(function (fc) {
                    if (!fc || !rowMatchesCardGroup(row, fc.groupMatch, splitCol)) return false;
                    if (fc.testKeys && fc.testKeys.length) {
                        var tv = getRowValue(row, splitCol);
                        if (tv === undefined || String(tv).trim() === "") tv = "Не заполнено";
                        else tv = String(tv).trim();
                        return fc.testKeys.indexOf(tv) !== -1;
                    }
                    return true;
                });
            });
        }
        return currentFilteredData.filter(function (row) {
            var v = getRowValue(row, splitCol);
            if (v === undefined || String(v).trim() === "") v = "Не заполнено";
            return keySet[String(v).trim()] === true;
        });
    }

    document.getElementById("exportBtn").addEventListener("click", function () {
        var cardsHtml = collectCardsHtmlForExport();
        if (!cardsHtml) return;

        var filterTexts = [];
        for (var col in appliedFilters) {
            if (appliedFilters[col].size > 0) {
                filterTexts.push("<b>" + col + ":</b> " + Array.from(appliedFilters[col]).join(", "));
            }
        }

        var exportCardIndices = getSelectedCardIndicesForExport();

        var exportTemplate = [
            '<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>Отчет INVITRO</title>',
            '<style>body { font-family: "Segoe UI", sans-serif; padding: 30px; color: #333; background: #f4f7f6; }',
            ".export-header { background: #fff; padding: 25px; border-radius: 10px; margin-bottom: 25px; border-left: 4px solid #00a0c6; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }",
            ".card { background: #fff; padding: 25px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid #00a0c6; box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: grid; grid-template-columns: repeat(2, 1fr); row-gap: 12px; column-gap: 30px; }",
            ".card-field.full-width-header { grid-column: 1 / -1; margin-bottom: 5px; padding-bottom: 12px; border-bottom: 2px solid #e2e8f0; }",
            ".card-field.full-width-header .card-value { font-size: 16px; font-weight: 700; color: #00a0c6; }",
            ".card-field { padding-bottom: 10px; border-bottom: 1px dashed #f0f0f0; }",
            ".card-label { font-size: 11px; color: #5c6b70; font-weight: 700; margin-bottom: 6px; }",
            ".card-value { font-size: 14px; color: #111; line-height: 1.62; white-space: pre-line; max-width: 42em; }",
            ".card-value--multiline { padding: 10px 12px; background: #f7fafb; border-radius: 8px; border: 1px solid #e8eef0; max-width: none; }",
            "mark.search-highlight { background: #fff9c4; padding: 0 1px; border-radius: 2px; }",
            "mark.search-highlight--current { background: #ffe082; box-shadow: 0 0 0 2px #00a0c6; }",
            ".profile-chip { display: inline-block; font-size: 11px; padding: 4px 10px; border-radius: 999px; ",
            "background: #e8f4f8; border: 1px solid #c5e3ed; margin: 0 6px 6px 0; }</style></head><body>",
            '<div class="export-header"><h2>Аналитический отчет</h2>' +
                (exportCardIndices.length > 0
                    ? '<p style="font-size:14px;margin:0 0 10px 0;">Экспорт: только отмеченные галочками карточки (' +
                      exportCardIndices.length +
                      ").</p>"
                    : "") +
                '<div class="export-filters">Параметры поиска:<br>' +
                filterTexts.join("<br>") +
                "</div></div>",
            cardsHtml,
            "</body></html>"
        ].join("\n");

        var blob = new Blob([exportTemplate], { type: "text/html;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        var dateStr = new Date().toLocaleDateString("ru-RU").replace(/\./g, "-");
        a.download = "Report_INVITRO_" + dateStr + ".html";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });

    document.getElementById("exportExcelBtn").addEventListener("click", function () {
        if (!currentAnyFilterActive) return;
        var rows = getRowsForExportExcel();
        if (!rows.length) return;

        var worksheet = XLSX.utils.json_to_sheet(rows);
        var workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Данные");

        var dateStr = new Date().toLocaleDateString("ru-RU").replace(/\./g, "-");
        XLSX.writeFile(workbook, "Export_INVITRO_" + dateStr + ".xlsx");
    });
</script>
